name: Continuous Integration

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  # based on https://github.com/DavidAnson/markdownlint-cli2-action/blob/main/.github/workflows/changed.yml
  # runs markdown lint only for changed files
  markdownlint:
    name: run markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: tj-actions/changed-files@v47
        id: changed-files
        with:
          files: '**/*.md'
          separator: ","
      - uses: DavidAnson/markdownlint-cli2-action@v23
        if: steps.changed-files.outputs.any_changed == 'true'
        with:
          globs: "${{ steps.changed-files.outputs.all_changed_files }},!_includes"
          separator: ","
          config: '.markdownlint.json'

  # checks internal links and anchors in the built site, see lychee.toml
  linkcheck:
    name: check internal links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: bundle exec jekyll build
      - uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          args: >-
            --config lychee.toml
            --root-dir ${{ github.workspace }}/_site
            '_site/**/*.html'
          fail: true
