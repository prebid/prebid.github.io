name: Notify Code Path Changes

# Runs after "PR info" (pr-info.yml), from the default branch, so PR code never runs with these secrets.
on:
  workflow_run:
    workflows:
      - PR info
    types:
      - completed

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  notify:
    if: ${{ github.repository_owner == 'prebid' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Get PR
        id: pr
        uses: ./.github/actions/trusted-pr

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        # Outside the checkout, so npm doesn't install the repo's own dependencies.
        run: |
          cd "$RUNNER_TEMP"
          npm install --prefix "$RUNNER_TEMP/deps" --no-save --ignore-scripts axios@1.21.1 nodemailer@10.5.0

      - name: Run Notification Script
        env:
          NODE_PATH: ${{ runner.temp }}/deps/node_modules
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_PR_NUMBER: ${{ steps.pr.outputs.number }}
          GITHUB_TOKEN: ${{ github.token }}
          OAUTH2_CLIENT_ID: ${{ secrets.OAUTH2_CLIENT_ID }}
          OAUTH2_CLIENT_SECRET: ${{ secrets.OAUTH2_CLIENT_SECRET }}
          OAUTH2_REFRESH_TOKEN: ${{ secrets.OAUTH2_REFRESH_TOKEN }}
        run: node .github/workflows/scripts/send-notification-on-change.js
